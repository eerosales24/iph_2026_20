		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

### Pregunta I - Solución

```Python

f = tuple('57')  # tuple: ('5', '7') (un ítem por cada carácter)
```

- Salvo en la tupla vacía
    - **La coma es la que crea la tupla**, no los paréntesis

### Pregunta II - Solución

```Python
punto = (3, 7)

print(x, y)  # → 3 7

x, y = y, x
print(x, y)  # → 7 3

print(punto)  # → (3, 7)
```

    - `x` y `y` son variables independientes de la tupla

### Pregunta IV - Solución

```Python
colores = ('rojo', 'verde', 'azul')

print(colores[0])               # Línea A → rojo

colores[0] = 'negro'            # Línea B → TypeError: 'tuple' object does not support item assignment (las tuplas son inmutables)

colores = colores + ('negro',)  # Línea D → ✅ Crea una NUEVA tupla

print(colores)                  # Línea E → ('rojo', 'verde', 'azul', 'negro')
```

<br>

- La línea D **no modifica** la tupla original
    - Crea una tupla nueva y le asigna el nombre `colores`

### Pregunta V - Solución

```plaintext
[1, 2, 3, 4] [1, 2, 3, 4] True
(1, 2, 3, 4) (1, 2, 3) False
```

<br>

- Con la **lista** (mutable), `+=` modifica la misma lista
    - Ambos nombres ven el cambio
- Con la **tupla** (inmutable), `+=` crea una **tupla nueva**
    - Solo `tupla_a` se refiere a ella
    - `tupla_b` conserva la tupla original

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Uso de tuplas en funciones - Ejemplo

```Python
def encontrar_centro_rectangulo(esquina_inferior: tuple, esquina_superior: tuple) -> tuple:
    """
    Calcula el centro de un rectángulo a partir de sus esquinas como coordenadas. 

    Args:
        esquina_inferior (tuple): Coordenadas (x, y) de la esquina inferior izquierda.
          
        esquina_superior (tuple): Coordenadas (x, y) de la esquina superior derecha.

    Returns:
        tuple: Coordenadas del centro (x, y) del rectángulo.

    >>> encontrar_centro_rectangulo((0, 0), (10, 10))
    (5.0, 5.0)

    >>> encontrar_centro_rectangulo((1, 2), (5, 6))
    (3.0, 4.0)
    """
    x_centro = (esquina_inferior[0] + esquina_superior[0]) / 2

    y_centro = (esquina_inferior[1] + esquina_superior[1]) / 2

    # Se retorna una tupla (explícita en este caso):
    return (x_centro, y_centro)  
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Retorno explícito vs. implícito

```Python
return (x_centro, y_centro)  # Tupla explícita (con paréntesis)

return x_centro, y_centro    # Tupla implícita (sin paréntesis)
```

<br>

- Ambas formas retornan **la misma tupla**
- En ambos casos se usa **un solo** `return` ✅

### Pregunta XII - Solución

```Python
notas = (4.0, 3.5)

notas = notas + (5.0)        # Línea A → TypeError: can only concatenate tuple (not "float") to tuple
notas = notas + (5.0,)       # Línea B → ✅ notas = (4.0, 3.5, 5.0)

notas = notas + tuple(5.0)   # Línea C → TypeError: 'float' object is not iterable
```

- `(5.0)` no es una tupla, es un `float`
- `tuple()` solo convierte **iterables**
    - Un `float` no lo es
- Para concatenar **un solo elemento**:
    - Se debe crear una tupla unitaria: `(5.0,)`

### Pregunta XIV - Solución

```plaintext
Ana aprobó con 4.5
Sara aprobó con 3.0
```

<br>

- En cada iteración, el `for` toma una tupla de la lista
    - Y la **desempaqueta** en `codigo`, `nombre` y `nota`
- Es el mismo mecanismo de:
    - `for llave, valor in diccionario.items():`
- Equivale a usar índices (`estudiante[1]`, `estudiante[2]`)
    - Pero es **mucho más legible**
