					var element = itemsToFit[item];

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}

### Series (1/2)


- Cada valor tiene una **etiqueta**
	- Si no hay índice explícito:

print(edades)
```

2    19

```

### Comparación

- Comparar una Serie con un valor
	- Produce una **Serie de booleanos**:
		- Un resultado `bool` por elemento
- Operadores de comparación: `==`, `!=`, `>`, `>=`, `<`, `<=`

```Python
import pandas as pd

edades = pd.Series([15, 18, 21, 17])

print(edades >= 18)
```

```plaintext
0    False
1     True
2     True
3    False
dtype: bool
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### Filtrado (1/2)

- Una Serie con una condición
	- Dentro de `[]` **filtra**
		- Conservando solo los elementos con `True`
- Se conservan las etiquetas originales:


```Python
import pandas as pd

edades = pd.Series([15, 18, 21, 17])

mayores = edades[edades >= 18]  # Se filtra por condición de mayor o igual que 18

print(mayores)
```

```plaintext
1    18
2    21
dtype: int64
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### Filtrado (2/2)

- Si ningún elemento cumple la condición
	- El resultado es una Serie **vacía**


```Python
import pandas as pd

edades = pd.Series([15, 18, 21, 17])

mayores = edades[edades > 99999]

print(mayores)
```

<br>

```plaintext
Series([], dtype: int64)
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### `Series.value_counts()` (1/2)

- Cuenta cuántas veces aparece **cada valor**
- Retorna una **Serie**:
	- Etiquetas (índice): los valores, sin repetir
	- Valores: cuántas veces aparece cada uno
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### `Series.value_counts()` (2/2)

- La serie retornada estará
	- Ordenada de **mayor a menor** frecuencia
	- Solo incluye los valores que aparecen al menos una vez

	<br>

- Ayuda: [Series.value_counts](https://pandas.pydata.org/docs/reference/api/pandas.Series.value_counts.html)
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### `value_counts()` - Ejemplo

```Python
import pandas as pd

bebidas = pd.Series(['café', 'té', 'café', 'jugo', 'café',
                     'agua', 'té', 'café', 'jugo', 'té'])

conteo = bebidas.value_counts()

print(conteo)
```

```plaintext
café    4
té      3
jugo    2
agua    1
Name: count, dtype: int64
```

- `conteo` es una Serie de números: se puede recortar, ordenar y graficar
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### `head(n)` y `tail(n)`

- `head(n)`: retorna los **primeros** `n` elementos
- `tail(n)`: retorna los **últimos** `n` elementos
	- Si no se indica `n`
		- Es por defecto 5

<br>

- **No ordenan**: respetan el orden actual de la Serie

	<br>

- Ayuda: [Series.head](https://pandas.pydata.org/docs/reference/api/pandas.Series.head.html), [Series.tail](https://pandas.pydata.org/docs/reference/api/pandas.Series.tail.html)
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### `head(n)` y `tail(n)` - Ejemplo

```Python
import pandas as pd

bebidas = pd.Series(['café', 'té', 'café', 'jugo', 'café',
                     'agua', 'té', 'café', 'jugo', 'té'])

conteo = bebidas.value_counts()  # café 4, té 3, jugo 2, agua 1

print(conteo.head(2))  # Las 2 más pedidas

print(conteo.tail(2))  # Las 2 menos pedidas
```

```plaintext
café    4
té      3
Name: count, dtype: int64

jugo    2
agua    1
Name: count, dtype: int64
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### `Series.sort_values()`

- Retorna una **nueva** Serie ordenada por sus valores
	- Cada etiqueta se mueve con su valor
- `ascending`:
	- `ascending=True` (por defecto): de menor a mayor
	- `ascending=False`: de mayor a menor

	<br>

- Ayuda: [Series.sort_values](https://pandas.pydata.org/docs/reference/api/pandas.Series.sort_values.html)
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### `sort_values()` - Ejemplo

```Python
import pandas as pd

precios = pd.Series({'café': 3500, 'té': 2800, 'jugo': 5000, 'agua': 2000})

print(precios.sort_values())  # de menor a mayor

print(precios.sort_values(ascending=False).head(2))  # los 2 más caros
```

```plaintext
agua    2000
té      2800
café    3500
jugo    5000
dtype: int64

jugo    5000
café    3500
dtype: int64
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### `count()`, `sum()` y `mean()`

- Resumen la Serie en **un solo valor**
- Ignoran los valores nulos

<table border="1" style="border-collapse: collapse; width: 100%; text-align: center; font-size: 20px;">
  <thead style="background-color: #d3d3d3;">
    <tr>
      <th style="color: black;">Método</th>
      <th style="color: black;">Retorna</th>
    </tr>
  </thead>
  <tbody>
    <tr><td><code>count()</code></td><td>La cantidad de valores <b>no nulos</b> (NOTA: <code>len()</code> cuenta todos)</td></tr>
    <tr><td><code>sum()</code></td><td>La suma de los valores</td></tr>
    <tr><td><code>mean()</code></td><td>El promedio</td></tr>
  </tbody>
</table>

```Python
import pandas as pd

ventas = pd.Series([4, None, 8, 6])

print(ventas.count())  # → 3
print(len(ventas))  # → 4
print(ventas.sum())  # → 18.0
print(ventas.mean())  # → 6.0
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### <i class="fas fa-exclamation-triangle"></i> Cuidado: `sum()` con textos

- Con textos, `sum()` **concatena** y retorna *un solo `str`*
- Un `str` no es una Serie:
	- No tiene `value_counts()`, `head()`, etc.

```Python
import pandas as pd

silabas = pd.Series(['pa', 'pe', 'l'])

texto = silabas.sum()

print(texto, type(texto))  # → papel <class 'str'>

print(texto.value_counts())  # → Traceback (most recent call last):
#  ...
# AttributeError: 'str' object has no attribute 'value_counts'
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Encadenar métodos

- Cada método retorna un resultado
	- Sobre el que se puede aplicar otro método
- Se lee de izquierda a derecha:

```Python
import pandas as pd

bebidas = pd.Series(['café', 'té', 'café', 'jugo', 'café',
                     'agua', 'té', 'café', 'jugo', 'té'])

top2 = bebidas.value_counts().head(2)  # Serie: café 4, té 3

# La suma de los valores:
print(top2.sum())  # → 7
```

- `value_counts()` → Serie · `head(2)` → Serie · `sum()` → un solo número
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### `plot()` - Ejemplo

```Python
import pandas as pd
import matplotlib.pyplot as plt

bebidas = pd.Series(['café', 'té', 'café', 'jugo', 'café',

                     'agua', 'té', 'café', 'jugo', 'té'])
top3 = bebidas.value_counts().head(3)

ax = top3.plot(kind="bar", figsize=(7, 4), color="gray",
               title="Top 3 bebidas más pedidas",
               xlabel="Bebida", ylabel="Cantidad de pedidos")
               
ax.figure.tight_layout()  # Ajusta los márgenes

plt.show()
```

### ¿Qué retorna cada paso?

<table border="1" style="border-collapse: collapse; width: 100%; text-align: center; font-size: 20px;">

    <tr><td><code>serie.value_counts()</code></td><td>Serie (valor → frecuencia)</td></tr>
    <tr><td><code>serie.head(n)</code> · <code>serie.tail(n)</code> · <code>serie.sort_values()</code></td><td>Serie</td></tr>
