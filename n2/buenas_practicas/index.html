	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};


        </script>

### Usar operadores relacionales compuestos

- En Python
	- Se puede evitar operaciones ineficientes
		- Con operadores relacionales compuestos
- Ej: 

```Python
x < y < z 

# No es lo mismo que:

(x < y) and (y < z)
```

- `x < y < z` es más eficiente aquí
	- Porque se evalúa a `y`
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### Nunca interrumpir un condicional (1/2)

- No interrumpir un condicional
	- Con la instrucción `return` (u otras: `continue`, `break`, `exit`, etc.)
- Ej:

```Python
def resultado_examen(puntuacion: float) -> str:
    resultado = 'no aprobado'  # variable de retorno
    if puntuacion >= 60:
        resultado = 'aprobado'
    return resultado  # Hay un solo retorno
```

- ✅ Hay un sólo `return` en la función
- ✅ Se usa una variable de retorno (`resultado`)
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

```

### Usar `min()` y `max()` de forma segura

- Considerar el caso de **secuencias vacías** al usar `min()` o `max()`
	- Usar `default` para evitar [`ValueError`](https://eerosales24.github.io/iph_2026_20/general/errores_comunes/#/11) 
		- Cuando las estructura esté vacía:

	<br>

```python
cadena = ""
diccionario = {}
```

<br>

✅ Seguro:
```python
min(cadena, default='N/A')
max(diccionario, default='N/A')
```

<br>

 ❌ Inseguro:
```python
min(cadena)  # ValueError
max(diccionario)  # ValueError
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### Usar validaciones seguras para métodos de `str` (1/2)

- Considerar que algunos métodos de `str` 
	- Retornan `False` cuando se llaman sobre un **string vacío** 
		- En lugar de lanzar error
		- Ej:
		
```python
''.isalpha()   # → False

''.isalnum()   # → False

''.isdigit()   # → False

''.islower()   # → False

''.isspace()   # → False
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### Usar validaciones seguras para métodos de `str` (2/2)

- Para evitar errores lógicos silenciosos
	- Se recomienda validar antes si el string está vacío
	- Ej:
	
```python
nombre = input("Digite su nombre: ")

if nombre and nombre.isalpha():
    # No vacío y alfabético:
    print("Nombre válido")
else:
    print("Nombre inválido")
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### Validar llaves de diccionarios (1/2)

- Evitar acceder directamente con `dic[llave]` 
	- Si la llave podría no existir.
  - ❌ `edad = datos["edad"]`  # puede lanzar KeyError

	<br>

- ✅  Verificar la existencia de la llave con `in`:
 
```python
    if "edad" in datos:  # Ingresa solo si la llave "edad" existe en `datos`
        edad = datos["edad"]
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#f8f8f8" -->

### Validar llaves de diccionarios (2/2)

- ✅ Usar `get()` para obtener un valor seguro si la llave no existe:

    ```python
    edad = datos.get("edad")  # retorna None si no existe
    ```

	<br>

- ✅  Usar `get()` con valor por defecto para evitar manejar `None`:
   
    ```python
    edad = datos.get("edad", 0)  # retorna 0 si no existe
    ```

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}
